version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: aml_postgres
    restart: always
    environment:
      POSTGRES_USER: aml_user
      POSTGRES_PASSWORD: aml_pass
      POSTGRES_DB: aml_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: aml_redis
    ports:
      - "6378:6379"
  minio:
    image: minio/minio:latest
    container_name: aml_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aml_minio_user
      MINIO_ROOT_PASSWORD: aml_minio_pass
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
  kafka:
    image: apache/kafka:4.1.2
    container_name: aml_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  postgres_data:
  minio_data: